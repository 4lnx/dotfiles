# Remove default prefix (Ctrl + b)
unbind C-b

# Unbind arrow keys to prevent accidental switching
unbind -n S-Left
unbind -n S-Right
unbind -n S-Up
unbind -n S-Down
unbind -n M-S-Left
unbind -n M-S-Right
unbind -n M-S-Up
unbind -n M-S-Down

# General bindings
bind ^X lock-server
bind ^C new-window -c "$HOME"
bind ^D detach
bind * list-clients

# Command prompt
bind : command-prompt

# Synchronization
bind * setw synchronize-panes

# Pane border status
bind P set pane-border-status

# Rename window and Reload config
bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf

# Zoom pane
bind z resize-pane -Z
# bind ^L refresh-client
# bind l refresh-client

# Switch panes with Shift + Alt + Arrows (no prefix)
bind -n M-S-Left  select-pane -L
bind -n M-S-Right select-pane -R
bind -n M-S-Up    select-pane -U
bind -n M-S-Down  select-pane -D

# Switch windows with Ctrl + Shift + Arrows (no prefix)
bind -n C-S-Left  previous-window
bind -n C-S-Right next-window

# Send Ctrl + L to terminal (clear screen) even without prefix
bind -n C-l send-keys C-l

# Copy mode bindings (vi style)
bind-key -T copy-mode-vi v send-keys -X begin-selection             # Start selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle          # Toggle rectangle selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel   # Copy and exit copy mode

# Split panes
bind v split-window -h -c "#{pane_current_path}"  # Vertical split (side-by-side)
bind h split-window -v -c "#{pane_current_path}"  # Horizontal split (top-bottom)

# Resize panes with Ctrl + Arrow keys (hold Ctrl to keep resizing)
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5
